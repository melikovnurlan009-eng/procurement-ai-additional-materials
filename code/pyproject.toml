[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "procurement-kg-rag"
version = "1.0.0"
description = "Authority-aware hybrid RAG over the UK procurement knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.13,<2",
  "requests>=2.31,<3",
  "streamlit>=1.38,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
procurement-kg = "procurement_kg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["procurement_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
